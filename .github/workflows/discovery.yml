name: Update discovery assets
on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'scripts/generate_discovery.py'
      - '.github/workflows/discovery.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: discovery-main
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/generate_discovery.py
      - name: Commit generated public assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' sitemap.xml llms.txt llms-full.txt literature.json literature.csv
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate public discovery assets"
            git push
          fi
