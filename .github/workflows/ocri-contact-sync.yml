name: OCRI contact sync
on:
  schedule:
    - cron: '22 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ocri-contact-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      OCRI_SHEET_ID: ${{ secrets.OCRI_SHEET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'google-api-python-client>=2,<3' 'google-auth>=2,<3'
      - run: python scripts/sync_contacts.py
